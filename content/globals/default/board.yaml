        id: ceApjlUE
        name: 'Katie Jordan'
  -
    id: cmt-grounds
    type: committee
    enabled: true
    name: 'Grounds Crew'
    description: 'Keeps our entrance and shared spaces looking their best.'
    responsibilities: |-
