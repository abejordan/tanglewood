intro: 'Our board is made up of volunteer neighbors who serve on committees to keep Tanglewood a great place to live. Everyone is welcome — reach out to any committee below if you''d like to help.'
committees:
  -
    id: cmt-executive
    type: committee
    enabled: true
    name: 'Executive Board'
    description: 'The neighborhood association officers.'
    responsibilities: "- Set the direction of the neighborhood association\n- Oversee the annual budget and dues\n- Chair the annual meeting and quarterly board meetings\n- Support and coordinate the other committees"
    how_to_join: "Officer roles are filled through elections at the annual meeting. If you're interested in running, email the board."
