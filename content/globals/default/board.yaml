intro: |-
  Our board is made up of volunteer neighbors who serve on committees to help keep Tanglewood a great place to live. Everyone is welcome to get involved, and the time commitment can be as much or as little as you’d like. Whether you have a lot of time or just want to lend a hand when you can, we’d love to have you!

  To join a committee, email tanglewoodindy@gmail.com and let us know which committee(s) you’re interested in.
committees:
  -
    id: cmt-executive
    type: committee
    enabled: false
    name: 'Executive Board'
    description: 'The neighborhood association officers.'
    responsibilities: |-
      - Set the direction of the neighborhood association
      - Oversee the annual budget and dues
      - Chair the annual meeting and quarterly board meetings
      - Support and coordinate the other committees
    how_to_join: "Officer roles are filled through elections at the annual meeting. If you're interested in running, email the board."
