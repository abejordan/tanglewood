  -
    id: cmt-communications
    type: committee
    enabled: true
    name: Communications
    description: 'Keeps neighbors informed through the newsletter, social media, and website.'
    responsibilities: |-
      - Publish the neighborhood newsletter
      - Manage social media and the website
      - Take photos at events
      - Share event reminders and important updates
    how_to_join: "If you enjoy writing, photography, or social media, we'd love your help. Email the board."
    members:
