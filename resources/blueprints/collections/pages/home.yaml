title: Home Page
sections:
  hero:
    display: Hero
    fields:
      -
        handle: title
        field:
          type: text
          display: Title
          instructions: 'The internal name of this page (not shown on the site).'
          required: true
          validate:
            - required
      -
        handle: hero_headline
        field:
          type: text
          display: 'Welcome Headline'
          instructions: 'The big welcome message at the top of the home page.'
      -
        handle: hero_intro
        field:
          type: textarea
          display: 'Welcome Intro'
          instructions: 'A short, friendly paragraph introducing the neighborhood.'
      -
        handle: hero_newsletter_button
        field:
          type: group
          display: 'Newsletter Button'
          instructions: 'Button linking to the newsletter page.'
          fields:
            -
              import: button
      -
        handle: hero_events_button
        field:
          type: group
          display: 'Events Button'
          instructions: 'Button linking to the events page.'
          fields:
            -
              import: button
      -
        handle: hero_dues_button
        field:
          type: group
          display: 'Dues Button'
          instructions: 'Button linking to the dues page.'
          fields:
            -
              import: button
  get_involved:
    display: 'Get Involved Section'
    fields:
      -
        handle: get_involved_headline
        field:
          type: text
          display: Headline
      -
        handle: get_involved_text
        field:
          type: textarea
          display: 'Short Description'
          instructions: 'A sentence or two encouraging residents to participate.'
      -
        handle: get_involved_button
        field:
          type: group
          display: 'Button'
          fields:
            -
              import: button
  pay_dues:
    display: 'Pay Dues Section'
    fields:
      -
        handle: pay_dues_headline
        field:
          type: text
          display: Headline
      -
        handle: pay_dues_text
        field:
          type: textarea
          display: 'Short Description'
          instructions: 'A sentence or two about paying dues online. The link itself is set in Site Settings.'
      -
        handle: pay_dues_button
        field:
          type: group
          display: 'Button'
          fields:
            -
              import: button
  seo:
    display: SEO
    fields:
      -
        handle: meta_title
        field:
          type: text
          display: 'SEO Title (optional)'
      -
        handle: meta_description
        field:
          type: textarea
          display: 'SEO Description (optional)'
  sidebar:
    display: Options
    fields:
      -
        handle: slug
        field:
          type: slug
          localizable: true
