<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        {{ partial:partials/meta }}

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">

        {{ vite src="resources/js/site.js|resources/css/site.css" }}
    </head>
    <body class="min-h-screen flex flex-col bg-cream-50 text-ink-900 antialiased">
        <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:bg-forest-700 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">
            Skip to main content
        </a>

        {{ partial:partials/header }}

        <main id="main" class="flex-grow">
            {{ template_content }}
        </main>

        {{ partial:partials/footer }}
    </body>
</html>
