<section class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-20">
    <header class="max-w-3xl">
        <h1 class="font-display text-4xl sm:text-5xl text-forest-900 tracking-tight text-balance">
            {{ title }}
        </h1>
        {{ if content }}
            <div class="mt-4 text-lg text-ink-700 leading-relaxed text-pretty">
                {{ content }}
            </div>
        {{ /if }}
    </header>

    <div class="mt-12 space-y-6">
        {{ collection:newsletters sort="date:desc" }}
            {{ partial:partials/newsletter_card }}
        {{ if no_results }}
            <div class="p-8 bg-white rounded-2xl border border-cream-200 text-center">
                <p class="text-ink-700">No newsletters have been published yet. Once the first one is uploaded, it will show up here.</p>
            </div>
        {{ /if }}
        {{ /collection:newsletters }}
    </div>
</section>
