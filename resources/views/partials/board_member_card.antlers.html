{{# Renders a single board member. Expects to be used inside a members grid loop. #}}
<article class="bg-white rounded-2xl border border-cream-200 shadow-sm p-6 flex flex-col items-center text-center">
    <div class="w-24 h-24 rounded-full overflow-hidden bg-forest-50 flex items-center justify-center border-2 border-cream-100">
        {{ if photo }}
            {{ photo }}
                <img src="{{ url }}" alt="{{ alt ?? name }}" class="w-full h-full object-cover" loading="lazy">
            {{ /photo }}
        {{ else }}
            <svg class="w-10 h-10 text-forest-500" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5Zm0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5Z" />
            </svg>
        {{ /if }}
    </div>

    <h3 class="mt-4 font-display text-xl text-forest-900">{{ name }}</h3>
    <p class="mt-1 text-sm font-medium uppercase tracking-wide text-forest-600">{{ position }}</p>

    {{ if bio }}
        <p class="mt-3 text-[15px] text-ink-700 leading-relaxed">{{ bio }}</p>
    {{ /if }}

    {{ if email }}
        <a href="mailto:{{ email }}" class="mt-4 inline-flex items-center gap-1.5 text-sm text-forest-700 hover:text-forest-800 underline decoration-forest-600/30 hover:decoration-forest-600 underline-offset-4">
            <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3 4a2 2 0 0 0-2 2v1.161l8.581 4.29a1.5 1.5 0 0 0 1.339 0L19.5 7.161V6a2 2 0 0 0-2-2H3Z" /><path d="M19.5 8.839 12.591 12.34a3 3 0 0 1-2.681 0L3 8.839V14a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V8.839Z" /></svg>
            {{ email }}
        </a>
    {{ /if }}
</article>
