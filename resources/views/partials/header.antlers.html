{{ site_settings }}
<header class="bg-cream-50/95 backdrop-blur border-b border-cream-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 sm:h-20 gap-4">

            {{# Brand / neighborhood name #}}
            <a href="/" class="flex items-center gap-2 font-display text-xl sm:text-2xl font-medium text-forest-800 hover:text-forest-600 transition-colors">
                <svg class="w-7 h-7 text-forest-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2 L4 10 v10 h5 v-6 h6 v6 h5 V10 z" />
                </svg>
                <span>{{ name }}</span>
            </a>

            {{# Desktop nav #}}
            <nav class="hidden md:flex items-center gap-1" aria-label="Main navigation">
                {{ nav:main }}
                    {{ unless title == 'Pay Dues' }}
                        <a
                            href="{{ url }}"
                            class="px-3 py-2 rounded-md text-[15px] font-medium text-ink-700 hover:text-forest-700 hover:bg-forest-50 transition-colors {{ if is_current || is_parent }}text-forest-800 bg-forest-50{{ /if }}"
                        >
                            {{ title }}
                        </a>
                    {{ /unless }}
                {{ /nav:main }}

                <a
                    href="/dues"
                    class="ml-3 inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-medium text-[15px] shadow-sm transition-colors focus:outline-none"
                >
                    Pay Dues
                </a>
            </nav>

            {{# Mobile toggle #}}
            <button
                type="button"
                data-nav-toggle
                aria-expanded="false"
                aria-controls="mobile-menu"
                class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-forest-800 hover:bg-forest-50 focus:outline-none"
            >
                <span class="sr-only">Open main menu</span>
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="4" y1="7" x2="20" y2="7" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="4" y1="17" x2="20" y2="17" />
                </svg>
            </button>
        </div>

        {{# Mobile menu #}}
        <div id="mobile-menu" data-nav-menu class="hidden md:hidden pb-4">
            <nav class="flex flex-col gap-1 pt-2 border-t border-cream-200" aria-label="Mobile navigation">
                {{ nav:main }}
                    <a
                        href="{{ url }}"
                        class="px-3 py-3 rounded-md text-base font-medium text-ink-700 hover:text-forest-700 hover:bg-forest-50 {{ if is_current || is_parent }}text-forest-800 bg-forest-50{{ /if }}"
                    >
                        {{ title }}
                    </a>
                {{ /nav:main }}

                <a
                    href="/dues"
                    class="mt-2 inline-flex items-center justify-center gap-1.5 px-4 py-3 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-medium text-base shadow-sm"
                >
                    Pay Dues
                </a>
            </nav>
        </div>
    </div>
</header>
{{ /site_settings }}
