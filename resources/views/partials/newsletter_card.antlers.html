{{# Renders a single newsletter as a card. Assumes it is called inside a newsletter entry loop. #}}
<article class="flex flex-col sm:flex-row gap-6 p-6 bg-white rounded-2xl border border-cream-200 shadow-sm hover:shadow-md transition-shadow">
    <div class="flex-shrink-0 flex sm:flex-col items-center sm:items-start gap-3 sm:gap-1">
        <div class="w-14 h-14 rounded-xl bg-forest-50 text-forest-700 flex items-center justify-center flex-shrink-0" aria-hidden="true">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
</svg>

        </div>
        <div class="sm:mt-2">
            <p class="text-xs font-semibold uppercase tracking-wide text-forest-600">Issue</p>
            <time datetime="{{ date format="Y-m-d" }}" class="text-sm text-ink-700 font-medium">
                {{ date format="F Y" }}
            </time>
        </div>
    </div>

    <div class="flex-grow">
        <h3 class="font-display text-xl text-forest-900 leading-snug">
            {{ title }}
        </h3>
        {{ if description }}
            <p class="mt-2 text-[15px] text-ink-700 leading-relaxed">{{ description }}</p>
        {{ /if }}

        <div class="mt-4">
            {{ if pdf }}
                {{ pdf }}
                    <a
                        href="{{ url }}"
                        target="_blank"
                        rel="noopener"
                        class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-forest-700 hover:bg-forest-800 text-white font-medium text-[15px] shadow-sm transition-colors"
                    >
                        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10.75 2.75a.75.75 0 0 0-1.5 0v8.19L6.53 8.22a.75.75 0 1 0-1.06 1.06l4 4a.75.75 0 0 0 1.06 0l4-4a.75.75 0 1 0-1.06-1.06l-2.72 2.72V2.75Z" /><path d="M3.5 12.75a.75.75 0 0 0-1.5 0v2.5A2.75 2.75 0 0 0 4.75 18h10.5A2.75 2.75 0 0 0 18 15.25v-2.5a.75.75 0 0 0-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5Z" /></svg>
                        Download PDF
                    </a>
                {{ /pdf }}
            {{ else }}
                <p class="text-sm text-ink-500 italic">PDF not yet uploaded.</p>
            {{ /if }}
        </div>
    </div>
</article>
